[package]
name = "imagesagevideo"
version = "0.10.0"
description = "Make Wan 2.2 video clips from every layer of an Image Sage document"
authors = ["Rob Mirabelle"]
edition = "2021"

[lib]
name = "imagesagevideo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"
chacha20poly1305 = "0.10"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

# Dependencies (image resizing, PNG encoding) are optimized in dev builds too, so layer pictures are fast while testing.
[profile.dev.package."*"]
opt-level = 2
